[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ned"
dynamic = ["version"]
description = "NED - Nov1ce Evidence Denier: an offline, satirical emotional evidence de-weighting engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NED Contributors" }]
keywords = ["satire", "evidence", "cognitive-bias", "fastapi", "cli", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Sh1oud/NED"
Repository = "https://github.com/Sh1oud/NED"
Issues = "https://github.com/Sh1oud/NED/issues"
Changelog = "https://github.com/Sh1oud/NED/blob/main/CHANGELOG.md"

[project.scripts]
ned = "ned.app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ned.app.version.__version__" }

[tool.setuptools.packages.find]
include = ["ned*"]

[tool.setuptools.package-data]
"ned.app.rules" = ["*.json"]
"ned.app.static" = ["*.css", "*.js"]
"ned.app.templates" = ["*.html"]
"ned.examples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ned.*"]

[tool.coverage.run]
source = ["ned"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ned", "tests"]
# ``pytest-cache-files-*`` directories appear when pytest cannot write its cache
# directory; they are empty leftovers, not source.
extend-exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode: NED is a bilingual project, full-width punctuation is intentional
    "RUF002",
    "RUF003",
    "N802",   # allow test-style / API-style names
    "B008",   # Typer uses function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["ned"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
